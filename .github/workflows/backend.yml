name: FlowSphere Backend CI/CD (Dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/flowsphere-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/flowsphere-backend:dev \
            .

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flowsphere-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flowsphere-backend:dev

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e

            APP_DIR=/home/ubuntu/Flowsphere

            cd $APP_DIR

            echo "Pull latest images..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flowsphere-backend:${GITHUB_SHA}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flowsphere-backend:dev

            echo "Stopping old container..."
            docker compose down || true

            echo "Starting new container..."
            docker compose up -d --force-recreate

            echo "Cleaning old images..."
            docker image prune -f --filter "until=168h"

            docker ps
